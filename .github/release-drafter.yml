name-template: "v$NEXT_PATCH_VERSION - Agentic AI Engineering"
tag-template: "v$NEXT_PATCH_VERSION"
categories:
  - title: "🚀 Features"
    labels:
      - "feature"
  - title: "🐛 Fixes"
    labels:
      - "bug"
  - title: "🧪 Tests"
    labels:
      - "test"
  - title: "🧰 Chores"
    labels:
      - "chore"
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
template: |
  ## What's Changed

  $CHANGES

  \n  _This release was generated by release-drafter._
